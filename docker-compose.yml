# Stage 1 — hlh-grafana-prometheus-ct
# Target: hlh-docker LXC 109 (192.168.1.9) → macvlan dedicated IP 192.168.1.14
# Grafana  http://192.168.1.14  (port 80, macvlan dedicated IP per user request)
# Prometheus http://prometheus:9090 internal (via internal bridge); external UI optional via Grafana or extra macvlan IP
# Storage: /srv/data/grafana-prometheus on host ZFS RaidZ1-6TB/hlh-docker-data (mp0) — see hlh-docker/deploy-hlh-docker.sh:281
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "192.168.1.9:9090:9090"
    networks:
      - internal
    # Prometheus is reachable at http://192.168.1.9:9090 (hlh-docker host IP) for external UI,
    # and at http://prometheus:9090 internally from Grafana via internal bridge.
    # To use a dedicated macvlan IP instead, add: networks: { internal, macvlan: { ipv4_address: 192.168.1.15 } }

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    ports:
      - "192.168.1.9:9100:9100"
    networks:
      - internal

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    restart: unless-stopped
    # Serve on port 80 so Grafana is reachable at http://192.168.1.14 (no port suffix).
    # Container process runs as uid 472 (grafana) — NET_BIND_SERVICE needed for port 80.
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=${GRAFANA_PORT:-80}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      internal:
      macvlan:
        ipv4_address: 192.168.1.14

volumes:
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/data/grafana-prometheus/prometheus_data
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/data/grafana-prometheus/grafana_data

networks:
  internal:
    driver: bridge
  macvlan:
    external: true
    name: ${MACVLAN_NAME:-macvlan}
