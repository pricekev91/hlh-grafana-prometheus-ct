# Stage 1 — hlh-grafana-prometheus-ct
# Target: hlh-docker LXC 109 (192.168.1.9)
# Grafana  http://192.168.1.9:3000 (grafana-proxy nginx sidecar — CANONICAL URL)
#   Works from LAN, VPN, and inside the LXC.
#   2026-10-08: removed the 192.168.1.14 macvlan. On top of the LXC veth it was
#   unreachable from inside the LXC (macvlan-on-veth can't hairpin ARP) and from
#   the VPN endpoint, so the "dedicated IP" only worked from some LAN clients
#   while tooling + VPN saw a dead page. Grafana now stays on the internal
#   bridge (port 3000); the proxy is the sole external path.
# Prometheus http://prometheus:9090 internal (Grafana datasource)
#          http://192.168.1.9:9090 external UI
# Storage: /vault/grafana on host ZFS RaidZ1-6TB/vault (mp1) — vault dataset,
#          survives LXC rebuilds
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "192.168.1.9:9090:9090"
    networks:
      - internal
    # Prometheus UI at http://192.168.1.9:9090 for external debugging,
    # and at http://prometheus:9090 internally from Grafana via the bridge.

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    ports:
      - "192.168.1.9:9100:9100"
    networks:
      - internal

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    restart: unless-stopped
    # Internal only — external access goes through grafana-proxy (nginx) on
    # http://192.168.1.9:3000. No macvlan (see header note).
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - internal

  grafana-proxy:
    image: nginx:alpine
    container_name: grafana-proxy
    restart: unless-stopped
    # Canonical external URL: http://192.168.1.9:3000 (LAN + VPN + inside LXC)
    ports:
      - "192.168.1.9:3000:80"
    volumes:
      - ./grafana-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - grafana
    networks:
      - internal

volumes:
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /vault/grafana/prometheus_data
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /vault/grafana/grafana_data

networks:
  internal:
    driver: bridge
