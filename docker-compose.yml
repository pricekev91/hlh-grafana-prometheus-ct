# Stage 1 — hlh-grafana-prometheus-ct
# Target: hlh-docker LXC 109 (192.168.1.9)
#
# Two external URLs, both required:
#   Grafana  http://192.168.1.14:80  (macvlan dedicated IP — CANONICAL, LAN;
#            this is what grafana.mizertech.net resolves to)
#          http://192.168.1.9:3000   (grafana-proxy nginx sidecar — works from
#            VPN and inside the LXC, where .14 is unreachable:
#            macvlan-on-veth can't hairpin ARP, and the VPN endpoint
#            192.168.2.1 drops packets to .14 while .9 works)
#   NOTE: `ports:` on the grafana service itself are IGNORED because the
#   macvlan driver does not support port mappings — external access on .14 is
#   direct L2 (port 80), and the proxy covers the rest.
# Prometheus http://prometheus:9090 internal (Grafana datasource)
#          http://192.168.1.9:9090 external UI
# Storage: /vault/grafana on host ZFS RaidZ1-6TB/vault (mp1) — vault dataset,
#          survives LXC rebuilds
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "192.168.1.9:9090:9090"
    networks:
      - internal
    # Prometheus UI at http://192.168.1.9:9090 for external debugging,
    # and at http://prometheus:9090 internally from Grafana via the bridge.

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    ports:
      - "192.168.1.9:9100:9100"
    networks:
      - internal

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    restart: unless-stopped
    # Dedicated macvlan IP 192.168.1.14, served on port 80 (no port suffix).
    # Container process runs as uid 472 (grafana) — NET_BIND_SERVICE needed
    # for port 80.
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=${GRAFANA_PORT:-80}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      internal:
      macvlan:
        ipv4_address: 192.168.1.14

  grafana-proxy:
    image: nginx:alpine
    container_name: grafana-proxy
    restart: unless-stopped
    # VPN + inside-LXC path (macvlan can't do host-published ports):
    # http://192.168.1.9:3000
    ports:
      - "192.168.1.9:3000:80"
    volumes:
      - ./grafana-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - grafana
    networks:
      - internal

volumes:
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /vault/grafana/prometheus_data
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /vault/grafana/grafana_data

networks:
  internal:
    driver: bridge
  macvlan:
    external: true
    name: ${MACVLAN_NAME:-macvlan}
