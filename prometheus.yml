# prometheus.yml for hlh-docker (LXC 109, 192.168.1.9)
# Scrapes: llama.cpp 192.168.1.12:80 + 192.168.1.11:80 (hlh-ai-engine-epu, v100)
# vLLM (192.168.1.13) decommissioned 2026-10-08 — job removed.
# Validate: promtool check config prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: hlh-docker

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: llamacpp
    metrics_path: /metrics
    static_configs:
      - targets: ['192.168.1.12:80']
        labels:
          engine: llamacpp
          instance: hlh-ai-engine
      - targets: ['192.168.1.11:80']
        labels:
          engine: llamacpp
          instance: hlh-ai-engine-epu

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: hlh-docker
