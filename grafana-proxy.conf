# grafana-proxy — publishes 192.168.1.9:3000 → grafana:3000 (CANONICAL URL)
# grafana stays on the internal bridge (no macvlan since 2026-10-08: the .14
# macvlan was unreachable from inside the LXC — macvlan-on-veth can't hairpin
# ARP — and from the VPN endpoint 192.168.2.1). This sidecar is the only
# external path, and it works from LAN, VPN, and inside the LXC.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 80;
    location / {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        # websockets for /api/live/ws (live queries, refresh)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # keep long-lived grafana connections open
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
